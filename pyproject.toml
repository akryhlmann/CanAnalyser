[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cananalyser"
version = "0.1.0"
description = "J1939 and CANopen bus monitor for Kvaser interfaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-can>=4.4",
    "cantools>=39",
    "canopen>=2.3",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cananalyser = "cananalyser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
